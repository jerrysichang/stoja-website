<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2a2a" />
    <title>Stoja Support</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header-inner">
        <a class="brand" href="../index.html" aria-label="Stoja home">
          <img class="brand-mark" src="../assets/stoja-icon.png" alt="" width="32" height="32" />
          <span class="brand-name">Stoja</span>
        </a>
        <nav class="top-nav" aria-label="Primary">
          <a
            class="link-muted header-download"
            href="https://apps.apple.com/us/app/stoja/id6761839249?mt=12"
            target="_blank"
            rel="noreferrer"
            >Download</a
          >
        </nav>
      </div>
    </header>

    <main class="page-main">
      <div class="container content-stack">
        <h1 class="section-title">Support</h1>
        <p class="muted">Need help? Reach out and we'll unblock you quickly.</p>

        <section class="panel support-panel">
          <form
            class="support-form"
            action="mailto:support@stoja.app"
            method="post"
            enctype="text/plain"
          >
            <label class="support-label" for="support-email">Your email</label>
            <input
              class="support-input"
              id="support-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />

            <label class="support-label" for="support-message">Message</label>
            <textarea
              class="support-input support-textarea"
              id="support-message"
              name="message"
              rows="6"
              required
            ></textarea>

            <button class="button button-primary support-send" type="submit">Send</button>
          </form>
        </section>
      </div>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <div class="modal-overlay" id="download-modal" aria-hidden="true" role="dialog">
      <div class="modal" aria-modal="true" aria-labelledby="download-title">
        <h2 id="download-title">Ready to try Stoja?</h2>
        <p class="muted">
          Replace this placeholder link with your signed release asset, GitHub release URL, or direct DMG file.
        </p>
        <div class="panel">
          <p><strong>Current release:</strong> v0.1.0 (placeholder)</p>
          <p>
            <a class="button button-primary" href="https://apps.apple.com/us/app/stoja/id6761839249?mt=12" target="_blank" rel="noreferrer">
              Download on the App Store
            </a>
          </p>
          <p class="muted">Requires macOS 13 or newer.</p>
        </div>
        <button type="button" class="modal-close-btn" data-close-download aria-label="Close modal">&times;</button>
      </div>
    </div>

    <script src="../footer.js"></script>
    <script src="../script.js"></script>
  </body>
</html>
